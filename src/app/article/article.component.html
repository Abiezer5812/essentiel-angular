<div class="card articleInfo">
  <img [src]="urlImg" [alt]="textAltImg" class="card-img-top">
  <div class="card-body">
    <h5 class="card-title" [ngStyle]="{color: getColor()}">
      {{ titreArticle | uppercase }}
      <span *ngIf="dispo === false"> - Indisponible</span>
    </h5>
    <h6 class="card-title">{{ prixArticle }} €</h6>
    <p class="card-text">{{ description }}</p>

    <!-- Lien dans son propre bloc -->
    <p class="mb-3">
     <a [routerLink]="['/details', idArticle]">=> Voir l'article</a>
    </p>

    <!-- Ligne de séparation -->
    <hr class="my-3">
   
    <!-- Boutons sous la ligne -->
    <div>
      <button (click)="onLike()" [ngClass]="{
        'show': jaime === true,
        'hidden': jaime === false
      }">J'aime</button>

      <button class="nolike" (click)="onLike()" [ngClass]="{
        'show': jaime === false,
        'hidden': jaime === true
      }">Je n'aime pas</button>
    </div>

    <p class="mt-2">Nombre de like : {{ nbLike }}</p>

    <input type="text" placeholder="Écris ton commentaire" [(ngModel)]="comment">
    <p class="mt-2 mb-0">COMMENTAIRE : {{ comment }}</p>
  </div>
</div>
