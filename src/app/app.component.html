<!-- Menu -->
<nav class="navbar bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="#">La Bonne Affaire</a>

    <button class="navbar-toggler" type="button" (click)="menuOuvert = !menuOuvert">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuOuvert">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Produits</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Message en haut -->
@if (message) {
  <div class="alert alert-success text-center mb-0 rounded-0">{{ message }}</div>
}

<!-- Contenu -->
<div id="home" class="container">

  <div class="row mt-4 mb-4">
    <app-article
      *ngFor="let element of liste"
      class="col-md-4"
      [titreArticle]="element.titreArticle"
      [prixArticle]="element.prixArticle"
      [description]="element.description"
      [urlImg]="element.urlImg"
      [textAltImg]="element.textAltImg"
      [dispo]="element.dispo"
      (info)="onAffiche($event)"></app-article>
  </div>
  
<!-- Pied de page -->
<footer class="bg-dark text-white text-center py-5">
  Copyright &copy; La Bonne Affaire
</footer>
