<!-- Menu -->
<nav class="navbar bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" href="#">La Bonne Affaire</a>

    <button class="navbar-toggler" type="button" (click)="menuOuvert = !menuOuvert">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuOuvert">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Produits</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Message en haut -->
@if (message) {
  <div class="alert alert-success text-center mb-0 rounded-0">{{ message }}</div>
}

<!-- Contenu -->
<div id="home" class="container">
  <div class="row mt-4 mb-4">

    <div class="col-md-4">
      <app-article
          [titreArticle]="'Vélo'"
          [prixArticle]="80"
          [description]="'Un super vélo tout terrain'"
          [urlImg]="'assets/images/vélo.webp'"
          [textAltImg]="'Un vélo'"
          [dispo]="false"
          (info)="onAffiche($event)"></app-article>
    </div>

    <div class="col-md-4">
      <app-article
          [titreArticle]="'Jouet'"
          [prixArticle]="15"
          [description]="'Un jouet pour les enfants'"
          [urlImg]="'assets/images/jouet.webp'"
          [textAltImg]="'Un jouet'"
          [dispo]="true"
          (info)="onAffiche($event)"></app-article>
    </div>

    <div class="col-md-4">
      <app-article
          [titreArticle]="'TV'"
          [prixArticle]="230"
          [description]="'Très bonne résolution'"
          [urlImg]="'assets/images/tv.jpg'"
          [textAltImg]="'Une télévision'"
          [dispo]="true"
          (info)="onAffiche($event)"></app-article>
    </div>

  </div>
</div>

<!-- Pied de page -->
<footer class="bg-dark text-white text-center py-5">
  Copyright &copy; La Bonne Affaire
</footer>
